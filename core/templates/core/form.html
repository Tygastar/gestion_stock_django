{% extends "core/base.html" %}
{% block contenu %}
<h2>{{ titre }}</h2>
{% if enregistre_par %}
<p>Mouvement enregistrer par : <strong>{{ enregistre_par }}</strong></p>
{% endif %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-success">Enregistrer</button>
  <a class="btn btn-secondary" href="{{ url_liste }}">Annuler</a>
</form>
{% endblock %}
